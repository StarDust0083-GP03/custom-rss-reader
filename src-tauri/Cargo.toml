[package]
name = "tauri-app"
version = "0.1.0"
description = "RSS Reader - a Tauri RSS reader with AI translation and semantic search"
authors = ["StarDust0083-GP03"]
edition = "2021"
default-run = "tauri-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# DevTools are only enabled for local development: `tauri dev --features devtools`
default = []
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono"] }
feed-rs = "2.1"
quick-xml = { version = "0.36", features = ["serialize"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli"] }
scraper = "0.22"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
async-trait = "0.1"
dirs = "5.0"
html2md = "0.2"
futures = "0.3"
chromadb = "2.3.0"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
tokenizers = "0.23.1"
ndarray = "0.17.2"
anyhow = "1.0.104"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
