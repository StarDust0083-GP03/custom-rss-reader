<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="/src/styles.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <title>RSS Reader</title>
        <script type="module" src="/src/main.ts"></script>
    </head>

    <body>
        <div class="app-container">
            <!-- 左栏：订阅列表 -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h1>RSS Reader</h1>
                    <div class="sidebar-actions">
                    <button id="add-feed-btn" title="Add Feed">+</button>
                    <button id="refresh-all-btn" title="Refresh All">↻</button>
                    <button id="sidebar-menu-btn" class="menu-btn" title="More">⋯</button>
                </div>
                <div id="sidebar-menu" class="dropdown-menu">
                    <button type="button" class="dropdown-item" data-action="import-opml">Import OPML</button>
                    <button type="button" class="dropdown-item" data-action="export-opml">Export OPML</button>
                </div>
                </div>

                <div class="sidebar-content">
                    <div class="filter-tabs">
                        <button class="filter-tab active" data-filter="all">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
                            <span class="filter-label">All</span>
                        </button>
                        <button class="filter-tab" data-filter="unread">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
                            <span class="filter-label">Unread</span>
                        </button>
                        <button class="filter-tab" data-filter="favorites">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
                            <span class="filter-label">Favorites</span>
                        </button>
                        <button class="filter-tab" data-filter="read-later">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
                            <span class="filter-label">Read Later</span>
                        </button>
                        <button class="filter-tab" data-filter="today">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                            <span class="filter-label">Today</span>
                        </button>
                        <button class="filter-tab" data-filter="tag">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>
                            <span class="filter-label">Tags</span>
                        </button>
                    </div>
                    <div class="subscription-list" id="subscription-list">
                        <!-- Subscriptions will be rendered here -->
                    </div>
                </div>
            </aside>

            <!-- 列宽调节柄：拖动调宽，双击折叠/展开 -->
            <div class="col-resizer" id="resizer-sidebar" title="拖动调宽，双击折叠/展开"></div>

            <!-- 中栏：内容列表 -->
            <section class="items-panel">
                <div class="items-header">
                    <h2 id="current-feed-title">All Items</h2>
                    <div class="header-actions">
                        <button id="recommend-btn" title="AI Recommended Reads">★ Picks</button>
                        <button id="items-menu-btn" class="menu-btn" title="More">⋯</button>
                    </div>
                    <div id="items-menu" class="dropdown-menu">
                        <button type="button" class="dropdown-item" data-action="mark-all-read">Mark All Read</button>
                        <button type="button" class="dropdown-item" data-action="chroma-settings">Semantic DB…</button>
                    </div>
                    <div class="search-box">
                        <button id="search-mode-btn" class="search-mode-btn" title="Toggle search mode">Text</button>
                        <input type="text" id="search-input" placeholder="Search items..." />
                    </div>
                </div>
                <div class="items-list" id="items-list">
                    <!-- Feed items will be rendered here -->
                </div>
            </section>

            <!-- 列宽调节柄：拖动调宽，双击折叠/展开 -->
            <div class="col-resizer" id="resizer-items" title="拖动调宽，双击折叠/展开"></div>

            <!-- 右栏：内容详情 -->
            <section class="detail-panel">
                <div class="detail-header">
                    <div class="detail-actions">
                        <button id="toggle-webview-btn" title="Toggle Web View">Web View</button>
                        <button id="translate-btn" title="Translate">Translate</button>
                        <button id="detail-menu-btn" class="menu-btn" title="More">⋯</button>
                    </div>
                    <div id="detail-menu" class="dropdown-menu">
                        <button type="button" class="dropdown-item" data-action="classify">Classify Tags</button>
                        <button type="button" class="dropdown-item" data-action="similar" id="similar-menu-item">Find Similar</button>
                        <button type="button" class="dropdown-item" data-action="ai-settings">AI Settings…</button>
                        <div class="theme-section">
                            <span class="theme-label">Theme</span>
                            <div class="theme-swatches">
                                <button type="button" class="theme-swatch" data-theme="paper" title="Paper" style="--swatch:#f7f2e9"></button>
                                <button type="button" class="theme-swatch" data-theme="sepia" title="Sepia" style="--swatch:#f3ead8"></button>
                                <button type="button" class="theme-swatch" data-theme="forest" title="Forest" style="--swatch:#f2f5ee"></button>
                                <button type="button" class="theme-swatch" data-theme="ocean" title="Ocean" style="--swatch:#eef3f6"></button>
                                <button type="button" class="theme-swatch" data-theme="noir" title="Noir" style="--swatch:#f4f4f2"></button>
<button type="button" class="theme-swatch" data-theme="onedark" title="Onedark" style="--swatch:#282c34"></button>
<button type="button" class="theme-swatch" data-theme="dracula" title="Dracula" style="--swatch:#282a36"></button>
<button type="button" class="theme-swatch" data-theme="monokai" title="Monokai" style="--swatch:#272822"></button>
<button type="button" class="theme-swatch" data-theme="nord" title="Nord" style="--swatch:#2e3440"></button>
<button type="button" class="theme-swatch" data-theme="solarized-dark" title="Solarized Dark" style="--swatch:#002b36"></button>
<button type="button" class="theme-swatch" data-theme="solarized-light" title="Solarized Light" style="--swatch:#fdf6e3"></button>
<button type="button" class="theme-swatch" data-theme="gruvbox-dark" title="Gruvbox Dark" style="--swatch:#282828"></button>
<button type="button" class="theme-swatch" data-theme="gruvbox-light" title="Gruvbox Light" style="--swatch:#fbf1c7"></button>
<button type="button" class="theme-swatch" data-theme="tokyonight" title="Tokyonight" style="--swatch:#1a1b26"></button>
<button type="button" class="theme-swatch" data-theme="catppuccin" title="Catppuccin" style="--swatch:#1e1e2e"></button>
<button type="button" class="theme-swatch" data-theme="github-dark" title="Github Dark" style="--swatch:#0d1117"></button>
<button type="button" class="theme-swatch" data-theme="github-light" title="Github Light" style="--swatch:#ffffff"></button>
<button type="button" class="theme-swatch" data-theme="vscode-dark" title="Vscode Dark" style="--swatch:#1e1e1e"></button>                            </div>
                        </div>
                    </div>
                    <div class="detail-item-actions">
                        <button id="mark-read-btn" title="Toggle read state">✓</button>
                        <button id="favorite-btn" title="Favorite">★</button>
                        <button id="read-later-btn" title="Read later">◷</button>
                        <a id="open-link-btn" href="#" target="_blank" title="Open in Browser">↗</a>
                    </div>
                </div>
                <div class="detail-content" id="detail-content">
                    <div class="detail-placeholder">Select an item to read</div>
                </div>
            </section>
        </div>

        <!-- 状态栏 -->
        <div class="status-bar" id="status-bar">
            <div class="status-left">
                <span class="status-icon" id="status-icon"></span>
                <span class="status-text" id="status-text">Ready</span>
            </div>
            <div class="status-right">
                <span class="status-timer" id="status-timer"></span>
                <span class="status-progress" id="status-progress"></span>
                <span class="status-count" id="status-count"></span>
            </div>
        </div>

        <!-- Add Feed Modal -->
        <div id="add-feed-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal">×</span>
                <h2>Add Subscription</h2>
                <form id="add-feed-form">
                    <div class="form-group">
                        <label for="feed-url">Feed URL *</label>
                        <input type="url" id="feed-url" required placeholder="https://example.com/feed.xml" />
                    </div>

                    <div class="form-group">
                        <label for="feed-title">Title</label>
                        <input type="text" id="feed-title" placeholder="My Feed" />
                    </div>

                    <div class="form-group">
                        <label for="website-url">Website URL</label>
                        <input type="url" id="website-url" placeholder="https://example.com" />
                    </div>

                    <div class="form-group">
                        <label for="rsshub-url">RSSHub URL</label>
                        <input type="text" id="rsshub-url" placeholder="Custom RSSHub route" />
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="use-website" />
                            Fetch content from website instead of RSS
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit">Add Subscription</button>
                        <button type="button" class="cancel-btn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Recommended Reads Modal -->
        <div id="recommend-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal">×</span>
                <h2>Editor's Picks</h2>
                <div id="recommendations-list">
                    <!-- Recommendation rows rendered here -->
                </div>
            </div>
        </div>

        <!-- AI Settings Modal -->
        <div id="ai-settings-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal">×</span>
                <h2>AI Configuration</h2>
                <form id="ai-settings-form">
                    <div class="form-group">
                        <label for="ai-api-key">API Key *</label>
                        <input type="password" id="ai-api-key" required placeholder="sk-..." />
                    </div>
                    <div class="form-group">
                        <label for="ai-base-url">Base URL</label>
                        <input type="url" id="ai-base-url" placeholder="https://api.deepseek.com" value="https://api.deepseek.com" />
                    </div>
                    <div class="form-group">
                        <label for="ai-model">Model</label>
                        <input type="text" id="ai-model" placeholder="deepseek-chat" value="deepseek-chat" />
                    </div>
                    <div class="form-group">
                        <label for="ai-max-chars">Max chars per segment</label>
                        <input type="number" id="ai-max-chars" placeholder="3000" value="3000" min="500" max="10000" />
                    </div>
                    <div class="form-actions">
                        <button type="button" id="test-ai-btn" class="test-btn">Test Connection</button>
                        <button type="submit">Save Configuration</button>
                        <button type="button" class="cancel-btn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ChromaDB Settings Modal -->
        <div id="chroma-settings-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal">×</span>
                <h2>ChromaDB Configuration</h2>
                <form id="chroma-settings-form">
                    <div class="form-group">
                        <label for="chroma-host">Host</label>
                        <input type="text" id="chroma-host" placeholder="http://localhost" value="http://localhost" />
                    </div>
                    <div class="form-group">
                        <label for="chroma-port">Port</label>
                        <input type="number" id="chroma-port" placeholder="8000" value="8000" min="1" max="65535" />
                    </div>
                    <div class="form-group">
                        <label for="chroma-collection">Collection Name</label>
                        <input type="text" id="chroma-collection" placeholder="rss_articles" value="rss_articles" />
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="chroma-enabled" />
                            Enable ChromaDB
                        </label>
                    </div>
                    <div class="form-actions">
                        <button type="submit">Save Configuration</button>
                        <button type="button" class="cancel-btn">Cancel</button>
                    </div>
                </form>
                <hr style="margin: 1rem 0; border-color: var(--border-color);" />
                <div style="display: flex; gap: 0.75rem;">
                    <button id="reindex-chroma-btn" class="test-btn" style="flex: 1;">Re-Index All Items</button>
                    <button id="chroma-health-btn" class="test-btn" style="flex: 1;">Health Check</button>
                </div>
            </div>
        </div>
    </body>
</html>
